name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [mobile]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # flutter_app 下已有 pubspec.yaml 与 lib/，这里补充生成 Android 骨架
      - name: Create Android scaffold
        working-directory: flutter_app
        run: flutter create --org com.nscript --project-name nscript_translate_tools --platforms android .

      # 部分插件(flutter_plugin_android_lifecycle)要求 compileSdk>=36，默认模板可能是34/35，
      # 在应用与所有子项目上强制提升到36。用单行 echo 追加，避免 heredoc 缩进破坏 YAML。
      - name: Force compileSdk 36
        working-directory: flutter_app
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            app_gradle=android/app/build.gradle.kts
          else
            app_gradle=android/app/build.gradle
          fi
          if [ -f android/build.gradle.kts ]; then
            root_gradle=android/build.gradle.kts
            extra=$'subprojects {\n    afterEvaluate { p ->\n        if (p.plugins.hasPlugin("com.android.library")) {\n            p.android {\n                compileSdk 36\n            }\n        }\n    }\n}\n'
          else
            root_gradle=android/build.gradle
            extra=$'subprojects {\n    afterEvaluate { p ->\n        if (p.hasProperty("android")) {\n            p.android {\n                compileSdkVersion 36\n            }\n        }\n    }\n}\n'
          fi
          sed -i 's/flutter\.compileSdkVersion/36/g' "$app_gradle"
          { echo; printf '%s' "$extra"; } >> "$root_gradle"
          echo "== app gradle compileSdk =="
          grep -nE "compileSdk" "$app_gradle" || true
          echo "== root gradle tail =="
          tail -12 "$root_gradle"

      # 向 AndroidManifest 注入存储读取权限(SAF 之外的必要权限)，并配置 file_picker
      - name: Add storage permissions to manifest
        working-directory: flutter_app
        shell: bash
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          # 在 <manifest ...> 后插入 uses-permission
          sed -i 's|<manifest \(.*\)>|<manifest \1>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>|' "$manifest"
          # 在 <application 标签加 requestLegacyExternalStorage(仅影响 API<=29)
          sed -i 's|<application|<application android:requestLegacyExternalStorage="true"|' "$manifest"
          echo "== manifest head =="
          head -20 "$manifest"

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error