name: nscript_translate_tools
description: NScripter 汉化工具集 Android 版（文本提取/注入、LLM 批量翻译、符号修复、dat 解封包）。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  file_picker: ^8.1.2
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  charset: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# file_picker 传递依赖 flutter_plugin_android_lifecycle 最新版要求 compileSdk>=36，
# 而 3.47 默认是 34；固定旧版本避免 AAR metadata 校验失败。
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.20

flutter:
  uses-material-design: true